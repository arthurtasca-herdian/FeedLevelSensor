[project]
name = "tof-sim"
version = "0.1.0"
description = "Noise-free simulation of the TMF8829 ToF sensor observing a silo feed surface"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "trimesh>=4.5",
    "rtree>=1.3",
    "pyvista[jupyter]>=0.44",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tof_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:trame_vtk.*",
    "ignore::DeprecationWarning:vtkmodules.*",
]
